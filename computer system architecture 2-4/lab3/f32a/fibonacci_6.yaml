name: fibonacci-4
limit: 400
memory_size: 0x120
input_streams:
  0x80: [6]
  0x84: []
reports:
  - name: Step-by-step
    slice: all
    view: |
      T {T:hex} A {A:hex} B {B:hex}
      {pc}:	{instruction}	{pc:label}
  - name: Result
    slice: last
    filter:
      - state
    view: |
      numio[0x80]: {io:0x80:dec}
      numio[0x84]: {io:0x84:dec}
    assert: |
      numio[0x80]: [] >>> []
      numio[0x84]: [] >>> [8]