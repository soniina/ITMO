name: fibonacci-4
limit: 1200
memory_size: 0x120
input_streams:
  0x80: [47]
  0x84: []
reports:
  - name: Step-by-step
    slice: all
    view: |
      T {T:dec} A {A:dec} B {B:dec}
      {pc}:	{instruction}	{pc:label}
  - name: Result
    slice: last
    filter:
      - state
    view: |
      numio[0x80]: {io:0x80:dec}
      numio[0x84]: {io:0x84:dec}
    assert: |
      numio[0x80]: [] >>> []
      numio[0x84]: [] >>> [-858993460]